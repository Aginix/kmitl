<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>มีอะไรใหม่ — {{วันที่ไทย}}</title>
    <style>
      body {
        font-family: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.7;
        color: #1f2328;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      .sub {
        color: #656d76;
        margin-top: 0;
      }
      h2 {
        border-bottom: 1px solid #d0d7de;
        padding-bottom: 0.3rem;
        margin-top: 2.2rem;
      }
      h3 {
        margin-bottom: 0.3rem;
      }
      .tag {
        display: inline-block;
        font-size: 0.75em;
        font-weight: 600;
        padding: 0.1em 0.5em;
        border-radius: 4px;
        margin-right: 0.4rem;
        vertical-align: middle;
      }
      .add {
        background: #dafbe1;
        color: #116329;
      }
      .imp {
        background: #ddf4ff;
        color: #0550ae;
      }
      .fix {
        background: #ffebe9;
        color: #a40e26;
      }
    </style>
  </head>
  <body>
    <h1>มีอะไรใหม่</h1>
    <p class="sub">อัปเดตระบบ ประจำวันที่ {{วันที่ไทย}}</p>

    <!-- One <h2> per user area, then one <h3> per item. Tag classes: add=ใหม่, imp=ปรับปรุง, fix=แก้ไข -->
    <h2>💰 งบประมาณ</h2>

    <h3><span class="tag add">ใหม่</span>{{หัวเรื่อง}}</h3>
    <ul>
      <li>{{รายละเอียด}}</li>
    </ul>
  </body>
</html>
